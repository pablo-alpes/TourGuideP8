# Pipeline with dockerized image of the project

#WARNING : let's be mindfdul this is until the project is done. Then trigger will be master.
trigger:
  branches:
    include:
      - dev

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'tourguide'
  tag: '0.0.1-SNAPSHOT'
  dockerRegistryServiceConnection: 'tourGuideContainerP8' #registry of the server connection, no token is needed, is handled internally by the ACR

stages:
- stage: Build
  displayName: 'Build and Push Docker Image'
  jobs:
  - job: Build
    displayName: 'Build Docker Image'
    steps:
    - task: Maven@3
      displayName: 'Maven Package'
      inputs:
        mavenPomFile: 'TourGuide/pom.xml'
        goals: 'package -DskipTests'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        mavenVersionOption: 'Default'

    - task: Docker@2
      displayName: 'Build and Push Docker Image into ACR'
      inputs:
        command: buildAndPush
        repository: $(imageName)
        dockerfile: TourGuide/Dockerfile
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
